services:
  - type: web
    name: perras-erp-v35-test
    runtime: node
    region: ohio
    plan: free
    rootDir: rootDir: perras_erp_v35_online_test-2
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: perras-erp-v35-db
          property: connectionString
      - key: PERRAS_ADMIN1_PASSWORD
        sync: false
      - key: PERRAS_ADMIN2_PASSWORD
        sync: false
      - key: PERRAS_BUREAU1_PASSWORD
        sync: false
      - key: PERRAS_BUREAU2_PASSWORD
        sync: false
      - key: PERRAS_TECH1_PASSWORD
        sync: false

databases:
  - name: perras-erp-v35-db
    region: ohio
    plan: free
